version: 2
# Dependabot keeps dependencies and GitHub Actions current.
# cooldown.default-days: 7 => only propose versions that have been public
# for at least 7 days, mitigating malicious just-published releases.
# Note: cooldowns delay version updates, but they do not delay security updates
#       (vulnerability fixes still open immediately).
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
